name: Thriftly CI

# Pokreće se svaki put kad pushate kod na GitHub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─────────────────────────────────────────
  # JOB 1: Provjeri da se frontend builda
  # ─────────────────────────────────────────
  build-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod s GitHuba
        uses: actions/checkout@v4

      - name: Postavi Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instaliraj dependencije
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Buildat React aplikaciju
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────
  # JOB 2: Provjeri da se Docker images grade
  # ─────────────────────────────────────────
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod s GitHuba
        uses: actions/checkout@v4

      - name: Postavi Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Izgradi sve Docker images
        run: docker compose build

      - name: Pokreni kontejnere
        run: docker compose up -d

      - name: Čekaj da backend postane zdrav
        run: |
          echo "Čekam backend healthcheck..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/ > /dev/null; then
              echo "Backend je zdrav!"
              exit 0
            fi
            echo "Pokušaj $i/20 — čekam 3s..."
            sleep 3
          done
          echo "Backend nije odgovorio na vrijeme."
          docker compose logs backend
          exit 1

      - name: Provjeri da frontend odgovara
        run: |
          sleep 5
          curl -sf http://localhost:8080 > /dev/null && echo "Frontend radi!" || (docker compose logs frontend && exit 1)

      - name: Zaustavi kontejnere
        if: always()
        run: docker compose down -v
